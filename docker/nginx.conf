server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;

    # Uploaded MeroShare CSVs are small, but the default 1M is tight enough to
    # be worth raising explicitly rather than debugging a 413 later.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # AI analysis calls can take a couple of minutes; the default 60s would
        # cut them off mid-request.
        fastcgi_read_timeout 300;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git) even if they end up under the root.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
